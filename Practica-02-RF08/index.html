<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de disponibilidad</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand">AutoPark</span>
        </div>
    </nav>

    
    <main class="container mt-5">

        <h1>Gestión de disponibilidad</h1>

        <p>
            Actualiza la disponibilidad y horario de tu espacio.
        </p>

        
        <div class="card espacio mt-4">

            <div class="card-body">

                <h2>Estacionamiento Centro</h2>

                <p>
                    <strong>Ubicación:</strong>
                    Centro de Pachuca
                </p>

                <p>
                    <strong>Disponibilidad:</strong>
                    <span id="disponibilidad">5</span> espacios
                </p>

                <p>
                    <strong>Horario:</strong>
                    <span id="horario">08:00 - 20:00</span>
                </p>

                <button
                    class="btn btn-primary"
                    onclick="mostrarFormulario()">
                    Actualizar
                </button>

            </div>

        </div>

       
        <div id="formulario" class="card mt-4 oculto">

            <div class="card-body">

                <h3>Actualizar espacio</h3>

                <label class="form-label">
                    Disponibilidad
                </label>

                <input
                    type="number"
                    id="nuevaDisponibilidad"
                    class="form-control"
                    value="5"
                    min="0">

                <label class="form-label mt-3">
                    Hora de inicio
                </label>

                <input
                    type="time"
                    id="horaInicio"
                    class="form-control"
                    value="08:00">

                <label class="form-label mt-3">
                    Hora de cierre
                </label>

                <input
                    type="time"
                    id="horaFin"
                    class="form-control"
                    value="20:00">

                <button
                    class="btn btn-success mt-3"
                    onclick="actualizarEspacio()">
                    Guardar cambios
                </button>

            </div>

        </div>

    </main>

    
    <script src="script.js"></script>

</body>
</html>
